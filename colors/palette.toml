# Single source of truth for desktop colorscheme.
# Consumed by ~/.config/colors/render.sh which generates:
#   ~/.config/eww/bar/_palette.scss
#   ~/.config/rofi/_palette.rasi
#   ~/.config/kitty/_palette.conf
#   ~/.config/nvim/lua/_palette.lua
#   ~/.config/gtk-3.0/_palette.css
#   ~/.config/gtk-4.0/_palette.css
#   ~/.config/hypr/_palette.lua
#   ~/.config/colors/_kde.colors  (symlinked into ~/.local/share/color-schemes/)
#   ~/.config/fastfetch/config.jsonc, LibreOffice xcu  (patched in place)
#   ~/Mahisoft Vault/.obsidian/snippets/palette.css  (Obsidian / AnuPpuccin)
#
# After editing, run: ~/.config/colors/render.sh

[colors]
primary            = "#cd9ae5"
secondary          = "#340152"
background         = "#3a2987"
view-bg            = "#0f0f14"
hover              = "rgba(47, 12, 70, 0.7)"
overlay-background = "rgba(58, 41, 135, 0.93)"
overlay-hover      = "rgba(205, 154, 229, 0.2)"
border             = "#ffffff"
accent             = "#0fcbf1"
urgent             = "#E74C3C"
fg                 = "#ffffff"
fg-muted           = "#b8b8b8"

[geometry]
radius = "8px"
